services:
  - type: web
    name: trabalho-protesto22-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
